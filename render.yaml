services:
  - type: web
    name: wbs-kipper-api
    env: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: MOCK_ANALYSIS
        value: "true"
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        value: https://your-vercel-app.vercel.app,http://localhost:3000
      - key: OPENAI_API_KEY
        sync: false
